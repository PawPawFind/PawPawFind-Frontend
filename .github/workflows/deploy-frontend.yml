name: Deploy Frontend

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # React/Vite 등 빌드 프로젝트면 주석 해제
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "20"
      #     cache: npm
      # - run: npm ci && npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976550610726:role/GitHubActions-PawPawFind-Frontend
          aws-region: ap-northeast-2

      - name: Sync to S3
        run: |
          SOURCE_DIR="."
          # SOURCE_DIR="dist"

          aws s3 sync "$SOURCE_DIR" "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude "README.md" \
            --exclude ".DS_Store"

          for file in $(find "$SOURCE_DIR" -maxdepth 5 -name "*.html" 2>/dev/null); do
            rel="${file#./}"
            aws s3 cp "$file" "s3://${{ secrets.FRONTEND_S3_BUCKET }}/$rel" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate"
          done

      # CloudFront 사용 시
      # - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
