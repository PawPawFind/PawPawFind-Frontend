name: Deploy Frontend

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install and build
        env:
          HUSKY: "0"
          VITE_API_BASE_URL: https://www.pawpawfind.com
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.VITE_KAKAO_MAP_APP_KEY }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::976550610726:role/GitHubActions-PawPawFind-Frontend
          role-session-name: github-actions-frontend
          aws-region: ap-northeast-2

      - name: Sync to S3
        run: |
          SOURCE_DIR="dist"

          aws s3 sync "$SOURCE_DIR" "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" \
            --delete \
            --exclude ".DS_Store"

          while IFS= read -r -d '' file; do
            rel="${file#"$SOURCE_DIR"/}"
            aws s3 cp "$file" "s3://${{ secrets.FRONTEND_S3_BUCKET }}/$rel" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate"
          done < <(find "$SOURCE_DIR" -name "*.html" -print0)

      # CloudFront 사용 시
      # - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
